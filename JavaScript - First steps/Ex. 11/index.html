<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="texto"></p>
    <script>
        /* Leer una cadena de texto desde un prompt y generar un array con la función split().
Posteriormente, mostrar la siguiente información: Número de palabras, primera palabra,
última palabra, las palabras colocadas en orden inverso, las palabras ordenadas de la “a”
hasta la “z” y las palabras ordenadas de la “z” hasta la ”a. */
        const entrada = prompt('Entrada de texto')
        if (entrada == null || entrada.trim() == '') {
            const warn = document.getElementById('texto')
            warn.textContent = "No ingresaste nada, bro."
        } else {
            const aux = entrada.trim().toLowerCase().split(' ')
            console.log('Numero de palabras: ' + aux.length)
            console.log('Primera palabra: ' + aux[0])
            const aux2 = aux.reverse()
            console.log('Ultima palabra: ' + aux2[0])
            console.log('Palabras orden inverso: ' + aux.join(' '))
            console.log('Orden alfabetico: ' + aux.sort().join(' '))
            console.log('Orden des-alfabetico (?: ' + aux.sort().reverse().join(' '))
        }
    </script>
</body>

</html>
