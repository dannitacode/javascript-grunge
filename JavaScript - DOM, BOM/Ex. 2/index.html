<!DOCTYPE html>
<html lang="es">
<!-- Realiza una página que muestre un formulario y verifique la entrada de un número
que esté comprendido entre 1 y 100. (Ejercicio 1 del práctico de Forms, agregue el
atributo novalidate en la etiqueta form) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First form</title>
</head>

<body>
    <form name="form" onsubmit="return validacion()" novalidate>
        <label for="numeros">Ingrese un numero del 1 al 100</label>
        <input type="number" name="number" style="display: block;">
        <input type="submit" value="Validar">
    </form>

    <script>
        const form = document.forms['form']
        const inputNumeros = form['number']
        function validacion() {
            flag = true;
            const inputNumerosValue = inputNumeros.value.trim()
            if (inputNumerosValue < 1 || inputNumerosValue > 100) {
                console.log('Error: tiene que ser mayor que 1 y menor que 100.')
                inputNumeros.style.borderColor = 'red'
                flag = false;
            } else {
                console.log('Ha pasado el test.')
                inputNumeros.style.borderColor = 'green'
            }

            if (flag === true) {
                form.reset()    
                return false;
            } else {  
                return false;
            }
        }
    </script>
</body>

</html>
