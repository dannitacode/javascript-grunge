<!DOCTYPE html>
<html lang="es">
    <!-- Realiza una página que capture las coordenadas del ratón y las muestre en el título del documento (title). -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function coordenadas(evt) {
            document.title = "x: " + evt.clientX + " y: " + evt.clientY
        }
        document.addEventListener('mousemove',coordenadas)
    </script>
</body>
</html>
